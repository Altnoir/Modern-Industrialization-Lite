modLoader="javafml"
loaderVersion="[2,)"
license="MIT"
issueTrackerURL="https://github.com/Altnoir/Modern-Tech/issues"

[[mods]]
modId="moderntech"
version="${mod_version}"
displayName="ModernTech"
displayURL="https://github.com/Altnoir/Modern-Tech"
logoFile="assets/moderntech/milogo.png"
authors="ALTNOIR,Azerococo,Technici4n;"
description='''A simplified fork of Modern Industrialization. Machines expose standard NeoForge energy, fluid and item capabilities, and electric machines use FE. Bring other mods for cables and pipes. Recipe levels and fixed machine speed multipliers replace gradual overclocking.'''

[[dependencies.moderntech]]
modId="minecraft"
type="required"
versionRange="[${minecraft_version}]"
ordering="NONE"
side="BOTH"

[[dependencies.moderntech]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.moderntech]]
modId="guideme"
type="required"
versionRange="${guideme_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.moderntech]]
modId="abysslib_reginth"
type="required"
versionRange="${abysslib_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.moderntech]]
modId="kubejs"
type="optional"
versionRange="${kubejs_version_range}"
ordering="AFTER"
side="BOTH"

[[mixins]]
config="moderntech.mixins.json"

[[dependencies.moderntech]]
modId="ftbquests"
type="optional"
versionRange="${ftb_quests_version_range}"
ordering="AFTER"
side="BOTH"
