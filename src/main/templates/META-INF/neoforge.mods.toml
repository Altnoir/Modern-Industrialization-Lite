description='''A simplified fork of Modern Industrialization. It removes the mod's own cables, fluid pipes, item pipes and transformers: machines expose NeoForge's standard energy, fluid and item capabilities, and all power and transport is expected to come from other mods. Energy is expressed directly in RF, and the LV/MV/HV/EV/SV tiers are kept only as machine classes.'''
